name: Public paired LoReFT diagnostic
on:
  push:
    branches: [research/qwen-offline-recovery-20261010]
    paths: ['.github/workflows/qwen-offline-recovery.yml']
permissions:
  contents: read
  actions: read
jobs:
  cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/reft_diagnostic.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install fixed CPU execution dependencies
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.57.6' 'bitsandbytes==0.50.2' 'accelerate==1.12.0' safetensors
      - uses: actions/download-artifact@v4
        with:
          name: qwen-model-chunks
          path: chunks
          run-id: 38034525037
          github-token: ${{ github.token }}
      - name: Restore immutable public model
        run: |
          set -euo pipefail
          sha256sum -c chunks/SHA256SUMS
          cat chunks/qwen.tar.part-* | tar -xf -
          rm -rf chunks
      - name: Obtain real frozen Qwen states
        run: python -u research/reft_diagnostic.py cache --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-diag-cache-${{ matrix.shard }}
          path: diagnostic/
          retention-days: 1
          compression-level: 1
  evaluate:
    needs: cache
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/reft_diagnostic.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install fixed CPU dependencies
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.57.6' safetensors
      - uses: actions/download-artifact@v4
        with:
          pattern: qwen-diag-cache-*
          path: diagnostic
          merge-multiple: true
      - name: Train one new adapter and compare fixed arms
        run: python -u research/reft_diagnostic.py train_eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen-diagnostic-results
          path: |
            diagnostic/result/
            research/reft_diagnostic.py
          retention-days: 1
          compression-level: 6
