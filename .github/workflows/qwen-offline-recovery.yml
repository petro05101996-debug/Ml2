name: Package completed LoReFT evidence
on:
  push:
    branches: [research/qwen-offline-recovery-20261010]
    paths: ['.github/workflows/qwen-offline-recovery.yml']
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research
            .github/workflows
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: qwen-final-diag-*
          path: collected
          merge-multiple: false
          run-id: 38036722290
          github-token: ${{ github.token }}
      - name: Recompute metrics and verify evidence hashes
        run: python3 -u research/consolidate_diagnostic.py
      - uses: actions/upload-artifact@v4
        with:
          name: Analyst_Real_Diagnostic_Result
          path: deliverable/
          retention-days: 7
          compression-level: 6
