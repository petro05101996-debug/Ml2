name: Transfer portable Qwen in bounded chunks
on:
  push:
    branches: [research/qwen-offline-recovery-20261010]
    paths: ['.github/workflows/qwen-offline-recovery.yml']
permissions:
  contents: read
  actions: read
jobs:
  split:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qwen-model-chunks
          path: chunks
          run-id: 38034525037
          github-token: ${{ github.token }}
      - name: Verify transferred chunks
        run: |
          set -euo pipefail
          sha256sum -c chunks/SHA256SUMS
          ls -lh chunks
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-part-00
          path: chunks/qwen.tar.part-00
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-part-01
          path: chunks/qwen.tar.part-01
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-part-02
          path: chunks/qwen.tar.part-02
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-part-03
          path: chunks/qwen.tar.part-03
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-part-04
          path: chunks/qwen.tar.part-04
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-part-05
          path: chunks/qwen.tar.part-05
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-part-06
          path: chunks/qwen.tar.part-06
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-parts-checksums
          path: chunks/SHA256SUMS
          retention-days: 1
