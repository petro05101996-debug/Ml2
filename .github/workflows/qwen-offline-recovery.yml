name: Finish paired LoReFT diagnostic
on:
  push:
    branches: [research/qwen-offline-recovery-20261010]
    paths: ['.github/workflows/qwen-offline-recovery.yml']
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [261010, 261011]
    env:
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install fixed CPU dependencies
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.57.6' safetensors
      - uses: actions/download-artifact@v4
        with:
          pattern: qwen-diag-cache-*
          path: diagnostic
          merge-multiple: true
          run-id: 38036207864
          github-token: ${{ github.token }}
      - name: Complete actual training and paired evaluation
        run: python -u research/finish_diagnostic.py --seed ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen-final-diag-${{ matrix.seed }}
          path: diagnostic/result/
          retention-days: 1
          compression-level: 6
